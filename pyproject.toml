[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssas-om-connector"
dynamic = ["version"]
description = "Read-only OpenMetadata ingestion connector for SQL Server Analysis Services (tabular via CSDL, multidimensional via MDSCHEMA)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "openmetadata-ingestion==1.13.3.*",
]

[project.optional-dependencies]
# SQL Server engine ingestion (T014) uses pymssql — pure-Python, no system ODBC driver.
mssql = ["pymssql>=2.2"]
dev = [
  "pytest>=8",
  "pytest-socket>=0.7",
  "lxml>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.version]
path = "src/ssas_om/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ssas_om"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"
pythonpath = ["src"]
