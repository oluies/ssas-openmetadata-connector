[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssas-om-connector"
dynamic = ["version"]
description = "Read-only OpenMetadata ingestion connector for SQL Server Analysis Services (tabular via CSDL, multidimensional via MDSCHEMA)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Örjan Lundberg" }]
dependencies = [
  "requests>=2.31",
  # Must match the SDK series of the ingestion image this is installed into.
  # A mismatch is not an error: both series exist on PyPI, so pip DOWNGRADES the
  # SDK inside the image and breaks every other connector, not just this one.
  "openmetadata-ingestion==2.0.1.*",
]

[project.optional-dependencies]
# SQL Server engine ingestion (T014) uses pymssql — pure-Python, no system ODBC driver.
mssql = ["pymssql>=2.2"]
kerberos = ["requests-kerberos>=0.14"]
ntlm = ["requests-ntlm>=1.2"]
dev = [
  "pytest>=8",
  "pytest-socket>=0.7",
  "lxml>=5",
  "ruff>=0.6",
  "ty>=0.0.73",
]

[tool.hatch.version]
path = "src/ssas_om/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ssas_om"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
# Type-check the package, not the tests (their dynamic importlib patterns are noise).
include = ["src"]
# source.py is the only OpenMetadata-SDK-facing module; the SDK's pydantic models
# require every field, so type-checking it in isolation is impractical (see
# ARCHITECTURE.md). It is exercised by the SDK-backed test suite instead.
exclude = ["src/ssas_om/source.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"
pythonpath = ["src"]
