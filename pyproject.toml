[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssas-om-connector"
dynamic = ["version"]
description = "Read-only OpenMetadata ingestion connector for SQL Server Analysis Services (tabular via CSDL, multidimensional via MDSCHEMA)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Örjan Lundberg" }]
dependencies = [
  "requests>=2.31",
  # A RANGE, not a pin. This is installed INTO an ingestion image that already
  # carries the SDK, so the job here is to declare the series we work against
  # and then leave the image's own version alone. pip does not touch an
  # already-satisfied requirement, so the base image's SDK survives untouched.
  #
  # It was "==2.0.1.*" until 2026-09-17, and that broke the image build on an
  # ordinary OpenMetadata patch bump: installed into an
  # openmetadata/ingestion-base:2.0.2.0 image, pip found the 2.0.1 series on
  # PyPI and DOWNGRADED the SDK inside it -- no error, because both series are
  # published. That breaks every other connector in the image, not just this
  # one. The consumer's Dockerfile reads the version back after install and
  # fails the build, which is how it was caught.
  #
  # (Four-part versions are written as image references on purpose: the
  # leak gate reads a bare one as an IPv4 address.)
  #
  # Keep the upper bound. A 3.x SDK is a different series and the mismatch this
  # bound prevents (1.13 vs 2.0) is exactly the one that motivated the old pin.
  "openmetadata-ingestion>=2.0,<3",
]

[project.optional-dependencies]
# SQL Server engine ingestion (T014) uses pymssql — pure-Python, no system ODBC driver.
mssql = ["pymssql>=2.2"]
kerberos = ["requests-kerberos>=0.14"]
# Native XMLA/TCP, so no IIS/msmdpump is needed in front of the instance.
# A separate package on purpose: it is a general protocol implementation whose
# only dependency is pyspnego, and pulling the OpenMetadata SDK into it would
# make it unusable for anyone outside this project.
#
# Pinned to a tag, not a branch. Consumers install this connector from git, so
# a floating @main here meant a push to the transport repo changed what they
# got with no change to this package and no way to reproduce an earlier
# install. Pinning it HERE rather than in the consumer is the only place it
# works: a consumer that adds its own direct reference for ssas-xmla-tcp while
# also requesting [tcp] gives pip two direct URLs for one distribution, which
# is ResolutionImpossible -- and it only fails once the two refs diverge, i.e.
# the moment the pin starts doing its job.
tcp = ["ssas-xmla-tcp @ git+https://github.com/oluies/ssas-xmla-tcp@v0.1.2"]
ntlm = ["requests-ntlm>=1.2"]
dev = [
  "pytest>=8",
  "pytest-socket>=0.7",
  "lxml>=5",
  "ruff>=0.6",
  "ty>=0.0.73",
]

[tool.hatch.metadata]
# The [tcp] extra is a direct reference (a git URL), because ssas-xmla-tcp is not
# on PyPI. Hatchling refuses direct references unless this is set, and the refusal
# is not scoped to that extra -- it fails the whole build, so `pip install
# ssas-om-connector` could not build a wheel at all, with or without [tcp].
allow-direct-references = true

[tool.hatch.version]
path = "src/ssas_om/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ssas_om"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
# Type-check the package, not the tests (their dynamic importlib patterns are noise).
include = ["src"]
# source.py is the only OpenMetadata-SDK-facing module; the SDK's pydantic models
# require every field, so type-checking it in isolation is impractical (see
# ARCHITECTURE.md). It is exercised by the SDK-backed test suite instead.
exclude = ["src/ssas_om/source.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"
pythonpath = ["src"]
