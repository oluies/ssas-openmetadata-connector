name: Secret scan

on:
  push:
    branches: ["main", "master", "001-ssas-openmetadata-metadata"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly full-history sweep, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the scan covers every commit
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
