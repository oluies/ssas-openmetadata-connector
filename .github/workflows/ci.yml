name: CI

on:
  push:
    branches: ["main", "master", "001-ssas-openmetadata-metadata"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.* mypy==1.11.* types-requests
      - name: ruff
        run: ruff check .
      - name: mypy (SDK-free core; source.py is the SDK boundary)
        run: mypy

  test-offline:
    name: offline unit tests (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-socket lxml requests
      # source.py tests importorskip the OpenMetadata SDK (absent here) and skip;
      # the SDK-free, socket-blocked hermetic suite must stay green on every version.
      - run: python -m pytest tests/unit

  test-sdk:
    name: full suite (OpenMetadata SDK image)
    runs-on: ubuntu-latest
    container:
      image: docker.getcollate.io/openmetadata/ingestion:1.13.3
    steps:
      - uses: actions/checkout@v4
      - run: pip install --user pytest pytest-socket lxml
      - name: pytest (incl. SsasSource + sample data)
        env:
          PYTHONPATH: src
        run: python -m pytest tests/unit
