name: CI

on:
  push:
    branches: ["main", "master", "001-ssas-openmetadata-metadata"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff (Astral linter)
        run: uvx ruff@latest check .
      - name: ty (Astral type checker; SDK-free core, source.py is the SDK boundary)
        run: uvx --with requests ty@0.0.73 check

  build:
    name: the package actually builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Nothing in CI built the distribution, so a metadata error that makes the
      # wheel unbuildable shipped to main and was only found by trying to install
      # it: the [tcp] extra is a direct reference (a git URL, since ssas-xmla-tcp
      # is not on PyPI) and hatchling refuses those unless
      # tool.hatch.metadata.allow-direct-references is set -- a refusal that fails
      # the WHOLE build, not just that extra.
      - name: build sdist and wheel
        run: uv build
      # --no-deps so this stays a packaging check: it must not drag in the
      # OpenMetadata SDK, whose series is pinned to the ingestion image.
      - name: install the built wheel and import the package
        run: |
          uv venv .pkgcheck
          uv pip install --python .pkgcheck --no-deps dist/*.whl
          .pkgcheck/bin/python - <<'EOF'
          import importlib, importlib.resources
          # Every module EXCEPT source.py imports without the OpenMetadata SDK,
          # which --no-deps deliberately withholds so this stays a packaging check
          # and cannot drag in an SDK whose series is pinned to the runtime image.
          for m in ("ssas_om", "ssas_om.client", "ssas_om.tcp_client",
                    "ssas_om.classify", "ssas_om.csdl", "ssas_om.mdschema",
                    "ssas_om.plan", "ssas_om.redact", "ssas_om.mapper_tabular",
                    "ssas_om.mapper_cube"):
              importlib.import_module(m)
          # source.py is the SDK boundary, so it can only be checked for PRESENCE
          # here -- the SDK image job is what imports it. A wheel that silently
          # omitted a module would otherwise pass every other job.
          shipped = {p.name for p in importlib.resources.files("ssas_om").iterdir()
                     if p.suffix == ".py"}
          missing = {"source.py", "tcp_client.py", "client.py"} - shipped
          assert not missing, f"the wheel is missing {missing}"
          import ssas_om
          print("built and imported", ssas_om.__version__, "|", len(shipped), "modules shipped")
          EOF
      # The [tcp] extra must be DECLARED in the built metadata and its target must
      # actually install. Both halves are needed: `pip install '.[tcp]' --no-deps`
      # would report success while resolving nothing, and the extra points at a git
      # URL, so a branch rename or an unmerged library breaks installation while
      # every other job stays green -- which is exactly what happened.
      - name: the [tcp] extra is declared in the built metadata
        run: |
          python - <<'EOF'
          import glob, re, zipfile
          whl = glob.glob("dist/*.whl")[0]
          z = zipfile.ZipFile(whl)
          meta = z.read(next(n for n in z.namelist() if n.endswith("METADATA"))).decode()
          extras = re.findall(r"^Provides-Extra: (.+)$", meta, re.M)
          assert "tcp" in extras, f"no tcp extra in built metadata; found {extras}"
          dep = [l for l in meta.splitlines()
                 if l.startswith("Requires-Dist:") and re.search(r"""extra == ['"]tcp['"]""", l)]
          assert dep, "the tcp extra declares no requirement"
          print("declared:", dep[0])
          EOF
      - name: the [tcp] extra's target actually installs
        run: |
          uv pip install --python .pkgcheck --no-deps --dry-run \
            "ssas-xmla-tcp @ git+https://github.com/oluies/ssas-xmla-tcp@main"

  test-offline:
    name: offline unit tests (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # source.py tests importorskip the OpenMetadata SDK (absent here) and skip;
      # the SDK-free, socket-blocked hermetic suite must stay green on every version.
      - name: pytest (hermetic core)
        env:
          PYTHONPATH: src
        run: >
          uv run --no-project --python ${{ matrix.python-version }}
          --with pytest --with pytest-socket --with lxml --with requests
          pytest tests/unit

  test-sdk:
    name: full suite (OpenMetadata SDK image)
    runs-on: ubuntu-latest
    container:
      image: docker.getcollate.io/openmetadata/ingestion:2.0.1.0
      # the ingestion image runs as a non-root user; run as root so the Actions
      # runner can write its temp/work dirs (checkout) inside the container.
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # uv installs straight into the image's Python (which carries the OM SDK),
      # bypassing the image's `pip` wrapper that refuses to run as root.
      - name: install test deps into the SDK python
        run: uv pip install --system --python "$(command -v python)" pytest pytest-socket lxml
      - name: pytest (incl. SsasSource + sample data)
        env:
          PYTHONPATH: src
        run: python -m pytest tests/unit

  leak-gate:
    name: no identifying tokens in committed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same gate the pre-commit hook runs, applied to every tracked file so a
      # bypassed hook or a rebase cannot let a host, IP, SID or connection string
      # through. Constitution principle I is NON-NEGOTIABLE and fixtures are
      # committed, so this belongs in CI and not only in a local hook.
      # Runs the hook itself, not a sed-rewritten copy: a rewrite that stops
      # matching yields a gate that scans nothing and exits 0.
      - name: leak gate over all tracked files
        env:
          LEAK_GATE_FILES_CMD: git ls-files
        run: .githooks/pre-commit
      # The gate's boundary is pinned in the tree, both directions: an image tag
      # must pass, a file path carrying a real address must not.
      - name: leak gate boundary cases
        run: ./tests/hooks/test_leak_gate.sh
